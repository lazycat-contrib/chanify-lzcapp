version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/chanify.lpk
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: chanify
build:
  run_buildscript: false
images:
  - id: chanify
    target: service
    service: chanify
    source: wizjin/chanify
    channel: stable
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: Chanify
    summary: 简单、安全的自托管消息推送工具
