application:
  subdomain: chanify
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://chanify:80/
services:
  chanify:
    # upstream: wizjin/chanify:1.5.1
    image: registry.lazycat.cloud/czyt/wizjin/chanify:fa0a7214fb1d5967
    command: serve --registerable=true --name=${LAZYCAT_BOX_NAME}_chanify --endpoint=https://${LAZYCAT_APP_DOMAIN}
    binds:
      - /lzcapp/var/data:/root/.chanify
