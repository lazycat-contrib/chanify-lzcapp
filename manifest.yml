lzc-sdk-version: "0.1"
name: Chanify
package: cloud.lazycat.app.chanify
version: 1.4.3
description: 一个简单的消息推送工具
homepage: https://www.chanify.net
author: chanify
application:
  subdomain: chanify
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  public_path:
    - /
  routes:
    - /=http://chanify:80/
services:
  chanify:
    image: registry.lazycat.cloud/czyt/wizjin/chanify:76706b942e8908e6
    command: serve --registerable=true --name=${LAZYCAT_BOX_NAME}_chanify --endpoint=https://${LAZYCAT_APP_DOMAIN}
    binds:
      - /lzcapp/var/data:/root/.chanify
unsupported_platforms:
  - ios
  - android
  - tvos
